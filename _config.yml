# Site settings
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"

locale: "en-US"
title: "Tony Guerich"
title_separator: "|"
subtitle: "Psalm studies, faith, and the occasional nerdy project"
name: "Tony Guerich"
description: "Articles by Tony Guerich — psalm studies, faith, and the occasional nerdy project."
url: "https://tguerich.github.io"
baseurl: ""
repository: "tguerich/tguerich.github.io"
search: true

# Author sidebar
author:
  name: "Tony Guerich"
  avatar: # "/assets/images/bio-photo.jpg"  (add a photo later if desired)
  bio: "Retired information systems professional in De Soto, Missouri. Writing about the Psalms, faith, and the occasional nerdy project."
  location: "De Soto, Missouri"
  links:
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/tguerich"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tguerich"

footer:
  links:
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/tguerich"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tguerich"

# Reading
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: America/Chicago
paginate: 5
paginate_path: /page:num/

include:
  - _pages
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
